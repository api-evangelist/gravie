apis:
- aid: gravie:transparency-in-coverage
  name: Gravie Transparency in Coverage Machine-Readable Files
  description: >-
    Public machine-readable files Gravie posts on behalf of its plan sponsors under the CMS Transparency in
    Coverage rule (45 CFR 147.211). Files cover in-network negotiated rates for the Cigna and Cigna OAP
    networks and the HPS/Paymedix network, plus out-of-network allowed amounts via Zelis. Plans effective
    September 1, 2022 or earlier are covered by PreferredOne's index; plans effective October 1, 2022 or later
    are covered by the Gravie-hosted files. This is a file-based regulatory data surface, not a REST API — the
    JSON payloads follow the CMS price-transparency schemas published by the Center for Medicare and Medicaid
    Services.
  humanURL: https://www.gravie.com/compliance/transparency-in-coverage/
  baseURL: https://static.gravie.com/MRFs/
  tags:
  - Transparency In Coverage
  - Machine Readable Files
  - Pricing
  - Regulatory
  - Health Insurance
  properties:
  - type: Documentation
    url: https://www.gravie.com/compliance/transparency-in-coverage/
  - type: InNetworkRates
    name: Cigna in-network rates (JSON, gzip)
    url: https://static.gravie.com/MRFs/CignaMRF.json.gz
  - type: InNetworkRates
    name: Cigna OAP in-network rates (JSON, gzip)
    url: https://static.gravie.com/MRFs/CignaOAPMRF.json.gz
  - type: InNetworkRates
    name: HPS / Paymedix in-network rates (ZIP)
    url: https://static.gravie.com/MRFs/HPSPaymedixMRF.zip
  - type: AllowedAmounts
    name: Zelis out-of-network allowed amounts (CSV)
    url: https://static.gravie.com/MRFs/ZelisMRF.csv
  - type: Index
    name: PreferredOne MRF index (plans effective 2022-09-01 or earlier)
    url: https://www.preferredone.com/mrf/
