aid: gravie
name: Gravie
description: >-
  Gravie is a Minneapolis, Minnesota health benefits company founded in 2013 that designs and administers
  health plans for small and midsize employers. Its flagship product, Comfort, is a level-funded group health
  plan with zero deductibles and zero copays on most common healthcare services (preventive and primary care,
  specialist visits, labs and imaging, generic prescriptions and virtual care), paired with Gravie ICHRA
  (Individual Coverage Health Reimbursement Arrangement) administration, Gravie Pay for out-of-pocket cost
  financing, Gravie Care member navigation, and a pharmacy benefit. Gravie acts as a third-party administrator
  on top of partner provider networks (Aetna Signature Administrators, Cigna, Cigna OAP, HPS/Paymedix, and
  historically PreferredOne), settling claims under payer IDs GRV01 and 62308. Gravie publishes no public
  developer program or documented API; its machine-readable public surface is the CMS Transparency in Coverage
  in-network rate and allowed-amount files it posts on behalf of plan sponsors, alongside member, employer and
  provider portals and native iOS/Android member apps served from a private api.gravie.com backend.
