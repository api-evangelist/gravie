  conforms: true
  evidence: >-
    Machine-readable in-network rate and allowed-amount files published on behalf of plan sponsors at
    static.gravie.com/MRFs/ (Cigna, Cigna OAP, HPS/Paymedix JSON/ZIP; Zelis out-of-network CSV), indexed at
    https://www.gravie.com/compliance/transparency-in-coverage/ — all four file URLs verified HTTP 200.
  url: https://www.gravie.com/compliance/transparency-in-coverage/
- id: no-surprises-act
  name: No Surprises Act (Consolidated Appropriations Act, 2021)
  conforms: true
  evidence: Gravie publishes the required "Your Rights and Protections Against Surprise Medical Bills" notice.
