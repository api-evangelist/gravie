source: https://www.gravie.com/compliance/
summary: >-
  Gravie's conformance posture is regulatory, not API-technical. As a health-benefits administrator it meets
  the US federal price-transparency, surprise-billing and health-privacy regimes and holds a SOC 2 Type 1
  attestation, and it exchanges claims over X12 EDI through a clearinghouse. It publishes no OpenAPI,
  AsyncAPI, GraphQL, MCP or A2A surface, no OAuth/OIDC discovery document and no RFC 9116 security.txt —
  every one of those was probed live on 2026-08-01 and missed.
standards:
